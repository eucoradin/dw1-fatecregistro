<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserindo mídias no html5</title>
</head>
<body>
    <h1>Incorporando midias no site</h1>

    <h2>Imagens:</h2>
    <img src=".\midias\imagem.jpg" alt="Foto de paisagem" width="300px" height="300px">

    <h2>Imagens com legenda:</h2>
    <figure>
        <img src=".\midias\grafico.png" alt="Gráfico de crescimento anual da empresa" width="300px" height="300px">
        <figcaption>
            Gráfico de crescimento da empresa em 2025.
        </figcaption>

        <h2>Áudio</h2>
        <audio controls>
            <source src=".\midias\audio.mp3" type="audio/mpeg">
            Não foi possível reproduzir o áudio.
        </audio>

        <h2>Vídeo</h2>
        <video controls width="400px">
            <source src=".\midias\video.mp4" type="video.mp4">
            Não foi possivel reproduzir o vídeo.
        </video>

        <h2>Vídeo incorporado do youtube:</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/TcBtFtkQFiU?si=WIWEDfEoV999dano&amp;start=7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <h2>Mapas:</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d763.2508960724284!2d-47.8561956111635!3d-24.497456872671798!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1788217451926!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <h2>Incorporando PDFs:</h2>
        <iframe 
        src=".\midias\documento.pdf"
        title="Horários do DSM1"
        width="600px"
        height="450px"> 
            

        </iframe>
        
    </figure>
</body>
</html>
