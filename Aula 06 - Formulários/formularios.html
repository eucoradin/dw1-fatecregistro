<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários no HTML5</h1>
    <form action="#" method="post">
        <label for="nome">Nome:</label><br>
        <!-- input text -->
        <input name="nome" type="text" id="nome" placeholder="Insira seu nome completo..."> <br>
        <!-- input email -->
         <label for="email">Email:</label><br>
        <input name="email" type="email" id="email" placeholder="Insira seu email..."><br>
        <!-- input senha -->
         <label for="senha">Senha:</label><br>
        <input name="senha" type="password" id="senha" placeholder="Insira sua senha..."> <br><br>
           <!-- Botão de submeter o formulário -->
            <input type="submit" value="Cadastrar">
            <!-- Botão de limpar o formulário -->
            <input type="reset" value="Limpar os campos">
    </form>
        <br><br>
        <hr>
        <h4>Outros inputs:</h4>
    <form>
        <label>Quantidade:</label><br>
           <!-- input de numeros -->
        <input type="number" min="0" max="10"><br>
        <label>Data:</label><br>
        <!-- input de data -->
         <input type="date" /><br><br>
         <!-- input de arquivo -->
         <label>Aquivo:</label><br>
         <input type="file" /><br><br>
         <!-- campo de texto longo -->
         <label>Comentários:</label><br>
         <textarea rows="4" cols="40"></textarea>
         <!-- campo invisivel -->
          <input type="hidden" name="Idproduto" value="9"/><br><br>
          <!-- caixa de seleção -->
           <label>Cursos:</label><br>
           <select name="Cursos">
                <option value="1">Programação</option>
                <option value="2">Design gráfico</option>
                <option value="3">Música</option>
                <option value="4">Enfermagem</option>
           </select>

    </form>
    <br><br>
    <hr>
    <!-- formulario completo -->
     <h2>Exemplo formulário completo:</h2><br>
     <form action="#" method="post">
        <fieldset>
            <legend>Dados pessoais</legend>
            <label for="name">* Nome:</label>
            <input type="text" placeholder="Insira seu nome..."
            id="name" name="name" required><br><br>
            <label for="nascimento">Data de nascimento:</label>
            <input type="date"><br><br>
            <label for="sexo">Sexo</label>
            <input type="radio" name="sexo">Masculino 
            <input type="radio" name="sexo">Feminino <br>
        </fieldset><br>
        <fieldset>
            <legend>Dados de endereço</legend>
             <label for="rua">Rua</label><br>
            <input type="text"><br>
            <label for="numero">Numero</label><br>
            <input type="number">
        </fieldset>
        <fieldset>
            <legend>Dados do produto:</legend>
            <label>Cor do produto:</label><br>
            <input type="color"><br><br>
            <input type="checkbox" required>Li e aceito os termos de uso.
            <br><br>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
            <input type="text" placeholder="Este campo está desativado" disabled>
        </fieldset>
     </form>
</body>
</html>
