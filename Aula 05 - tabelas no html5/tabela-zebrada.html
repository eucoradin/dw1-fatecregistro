<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela zebrada</title>
</head>
<body>
    <!-- Tabela Zebrada -->
     <table border="1">
        <thead>
            <tr>
                <th colspan="6">
                    <h3>Tabela de clientes</h3>
                </th>
            </tr>
            <tr>
                <th scope="col" colspan="3">Dados pessoais:</th>
                <th scope="col" colspan="2">Endereço:</th>
                <th scope="col">Contato:</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- DAdos pessoais -->
                 <th scope="col">Nome</th>
                 <th scope="col">Idade</th>
                 <th scope="col">Profissão</th>
                 <!-- endereço -->
                  <th scope="col">Rua</th>
                  <th scope="col">Cidade</th>

            </tr>
        </tbody>
     </table>
</body>
</html>
