<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classes de cores no Bootstrap</title>
    <!-- Importação do CSS bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Cores no Bootstrap</h1>

    <p class="h3 text-muted">Muted</p>

    <p class="h3 text-primary">Primary</p>

    <p class="h3 text-succes">succes</p>

    <p class="h3 text-info">Info</p>

    <p class="h3 text-warning">warning</p>

    <p class="h3 text-danger">danger</p>

    <p class="h3 text-secondary">secundary</p>

    <p class="h3 text-dark">dark</p>

    <p class="h3 text-light bg-success">light</p>

    <!-- aplicando 50% de opacidade no fundo vermelho -->
    <p class="h3 text-white-50 bg-danger">Alterando opacidade</p>

    <hr />

    <h1>Botões no bootstrap</h1>
    <button type="button" class="btn">Normal</button><br /><br />
    <button type="button" class="btn btn-primary">Primario</button><br /><br />
    <button type="button" class="btn btn-secondary">Secundario</button
    ><br /><br />
    <button type="button" class="btn btn-success">Sucesso</button><br /><br />
    <button type="button" class="btn btn-info">Informação</button><br /><br />
    <button type="button" class="btn btn-warning">Alerta</button><br /><br />
    <button type="button" class="btn btn-danger">Erro/Perigo</button
    ><br /><br />
    <button type="button" class="btn btn-dark">Escuro</button><br /><br />
    <button type="button" class="btn btn-light">Claro</button><br /><br />
    <!-- Importação do javascript do bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
